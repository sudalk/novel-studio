services:
  studio:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      APP_MODE: ${APP_MODE:-mock}
      DATA_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/studio.db
      JOBS_INLINE: ${JOBS_INLINE:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-https://api.aicoming.top/v1}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2.5-flare}
      IMAGE_ASPECT: ${IMAGE_ASPECT:-16:9}
      IMAGE_SIZE: ${IMAGE_SIZE:-}
      IMAGE_TIMEOUT_SEC: ${IMAGE_TIMEOUT_SEC:-300}
      IMAGE_GAP_SEC: ${IMAGE_GAP_SEC:-12}
      IMAGE_MAX_ATTEMPTS: ${IMAGE_MAX_ATTEMPTS:-6}
      IMAGE_RETRY_WAIT_SEC: ${IMAGE_RETRY_WAIT_SEC:-48}
      MOSI_API_KEY: ${MOSI_API_KEY:-}
      MOSS_API_KEY: ${MOSS_API_KEY:-}
      MOSS_BASE_URL: ${MOSS_BASE_URL:-https://api.mosi.cn}
      MOSS_MODEL: ${MOSS_MODEL:-moss-ttsd-1.0}
      MOSS_RESPONSE_FORMAT: ${MOSS_RESPONSE_FORMAT:-wav}
      MOSS_DELIVERY_METHOD: ${MOSS_DELIVERY_METHOD:-url}
      MOSS_ASYNC: ${MOSS_ASYNC:-auto}
      MOSS_GAP_SEC: ${MOSS_GAP_SEC:-1.5}
      MOSS_MAX_ATTEMPTS: ${MOSS_MAX_ATTEMPTS:-4}
      MOSS_RETRY_WAIT_SEC: ${MOSS_RETRY_WAIT_SEC:-8}
      VIDEO_WIDTH: ${VIDEO_WIDTH:-1280}
      VIDEO_HEIGHT: ${VIDEO_HEIGHT:-720}
      VIDEO_FPS: ${VIDEO_FPS:-24}
    volumes:
      - studio-data:/app/data

volumes:
  studio-data:
